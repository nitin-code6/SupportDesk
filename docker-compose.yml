services:
  db:
    image: postgres:16-alpine
    container_name: supportdesk-db
    restart: always
    environment:
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk_password
      POSTGRES_DB: supportdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportdesk-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://supportdesk:supportdesk_password@db:5432/supportdesk
      ENVIRONMENT: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/interactions}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      AI_ROTATION_STRATEGY: ${AI_ROTATION_STRATEGY:-round_robin}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportdesk-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
